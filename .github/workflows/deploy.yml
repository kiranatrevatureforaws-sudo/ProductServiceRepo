
name: Build and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, product-service-deploy]
    timeout-minutes: 30

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build Docker image
        run: |
          sudo -n docker build \
            -t product-service:${{ github.sha }} \
            .

      - name: Stop existing container
        run: |
          if sudo -n docker container inspect product-service >/dev/null 2>&1; then
            sudo -n docker rm -f product-service
          fi

      - name: Start new container
        run: |
          sudo -n docker run -d \
            --name product-service \
            --restart unless-stopped \
            -p 8081:8081 \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            product-service:${{ github.sha }}

      - name: Verify application health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 \
              http://localhost:8081/api/products >/dev/null; then
              echo "Deployment successful!"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed"
          sudo -n docker logs --tail 100 product-service
          exit 1
